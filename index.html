<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Railway Block Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   ROOT & RESET
   Sized for 3.5" TFT (480×320) and also works on desktop
═══════════════════════════════════════════════════ */
:root {
  --bg:         #0d1117;
  --surface:    #161b22;
  --border:     #21262d;
  --text:       #e6edf3;
  --muted:      #484f58;
  --track:      #30363d;
  --track-w:    6px;

  --green:      #2ea043;
  --green-glow: #3fb950;
  --red:        #da3633;
  --red-glow:   #f85149;
  --yellow:     #d29922;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', monospace;
  width: 480px;
  height: 320px;
  overflow: hidden;
  user-select: none;
}

/* ═══════════════════════════════════════════════════
   HEADER BAR
═══════════════════════════════════════════════════ */
#header {
  height: 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
}

#header h1 {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text);
  font-weight: 700;
}

.nano-pills {
  display: flex;
  gap: 6px;
}

.nano-pill {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 2px 7px;
  border-radius: 10px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--bg);
  transition: all 0.4s;
}
.nano-pill.online {
  color: var(--green-glow);
  border-color: var(--green);
  background: #2ea04318;
}

/* ═══════════════════════════════════════════════════
   TRACK CANVAS  (SVG fills the remaining space)
═══════════════════════════════════════════════════ */
#track-wrap {
  width: 480px;
  height: 288px;   /* 320 - 32 header */
  position: relative;
}

svg#map {
  width: 480px;
  height: 288px;
}

/* ═══════════════════════════════════════════════════
   BLOCK RECTANGLES
═══════════════════════════════════════════════════ */
.blk {
  transition: fill 0.3s, filter 0.3s;
  rx: 4;
}
.blk.clear {
  fill: var(--green);
  filter: drop-shadow(0 0 5px var(--green-glow));
}
.blk.occupied {
  fill: var(--red);
  filter: drop-shadow(0 0 7px var(--red-glow));
  animation: occ-pulse 0.7s ease-in-out infinite alternate;
}
@keyframes occ-pulse {
  from { filter: drop-shadow(0 0 4px var(--red-glow)); }
  to   { filter: drop-shadow(0 0 14px var(--red-glow)); }
}

/* Block label */
.blk-label {
  fill: #fff;
  font-family: 'Courier New', monospace;
  font-size: 9px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  opacity: 0.95;
}

/* ═══════════════════════════════════════════════════
   STATUS BAR (bottom)
═══════════════════════════════════════════════════ */
#statusbar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 480px;
  height: 22px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 16px;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.05em;
}
#statusbar .occ-count { color: var(--red-glow); font-weight: 700; }
#statusbar .clr-count { color: var(--green-glow); font-weight: 700; }
#statusbar .ts { margin-left: auto; }
</style>
</head>
<body>

<!-- ═══ HEADER ════════════════════════════════════════════════ -->
<div id="header">
  <h1>⬛ Railway Block Monitor</h1>
  <div class="nano-pills">
    <div class="nano-pill" id="pill1">NANO-1</div>
    <div class="nano-pill" id="pill2">NANO-2</div>
  </div>
</div>

<!-- ═══ TRACK MAP ═════════════════════════════════════════════ -->
<div id="track-wrap">

  <!--
  ═══════════════════════════════════════════════════════════════
  SVG TRACK LAYOUT  —  mirrors the image exactly:

    LINE C (Top):    ─────[B8]────[B9]────[B10]────────────[B11]
                                               \
    LINE B (Middle): ─────[B5]────[B6]────[B7]──╯  (merges into C)
                                               ↑ merge curve
    LINE A (Bottom): ─────[B1]────[B2]────[B3]────────────[B4]

  Coordinate space: 480 × 266 (288 minus 22 for statusbar)
  ═══════════════════════════════════════════════════════════════ -->

  <svg id="map" viewBox="0 0 480 266" xmlns="http://www.w3.org/2000/svg">

    <!-- ── GRID / BACKGROUND TEXTURE ──────────────────────── -->
    <defs>
      <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="#21262d"/>
      </pattern>
    </defs>
    <rect width="480" height="266" fill="url(#dots)"/>

    <!-- ────────────────────────────────────────────────────────
         TRACK RAILS  (background shadow first, then colour)
         Line A: y=200
         Line B: y=133, merges up to y=66 at x=310
         Line C: y=66
    ──────────────────────────────────────────────────────── -->

    <!-- Shadow tracks -->
    <path d="M 18 200 L 462 200" stroke="#0d1117" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 18 133 L 310 133 Q 360 133 360 100 L 360 66 L 462 66"
          stroke="#0d1117" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 18 66  L 310 66"
          stroke="#0d1117" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Line A — bottom straight -->
    <path d="M 18 200 L 462 200" stroke="#30363d" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Line B — middle, merges into C at x≈310 -->
    <path d="M 18 133 L 310 133 Q 360 133 360 100 L 360 66 L 462 66"
          stroke="#30363d" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Line C — top (left segment, before merge) -->
    <path d="M 18 66 L 310 66"
          stroke="#30363d" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Merge-zone post-merge top rail continuation (already drawn in Line B path) -->

    <!-- Rail end arrows (just decorative ticks) -->
    <line x1="18" y1="190" x2="18" y2="210" stroke="#30363d" stroke-width="3"/>
    <line x1="18" y1="123" x2="18" y2="143" stroke="#30363d" stroke-width="3"/>
    <line x1="18" y1="56"  x2="18" y2="76"  stroke="#30363d" stroke-width="3"/>
    <line x1="462" y1="190" x2="462" y2="210" stroke="#30363d" stroke-width="3"/>
    <line x1="462" y1="56"  x2="462" y2="76"  stroke="#30363d" stroke-width="3"/>

    <!-- Line labels -->
    <text x="8" y="203" fill="#484f58" font-family="Courier New" font-size="8" font-weight="700" text-anchor="middle">A</text>
    <text x="8" y="136" fill="#484f58" font-family="Courier New" font-size="8" font-weight="700" text-anchor="middle">B</text>
    <text x="8" y="69"  fill="#484f58" font-family="Courier New" font-size="8" font-weight="700" text-anchor="middle">C</text>

    <!-- ────────────────────────────────────────────────────────
         BLOCK RECTANGLES
         Block size: 44×18 px, centred on the track
         Sensor    x-centre    track-y   Block
         S1  →  B1   68        200        A
         S2  →  B2  168        200        A
         S3  →  B3  290        200        A
         S4  →  B4  400        200        A
         S5  →  B5   68        133        B
         S6  →  B6  168        133        B
         S7  →  B7  270        133        B
         S8  →  B8   68         66        C
         S9  →  B9  168         66        C
         S10 → B10  270         66        C
         S11 → B11  420         66   C (after merge, shared rail)
    ──────────────────────────────────────────────────────── -->

    <!-- Line A blocks -->
    <rect id="B1"  class="blk clear" x="46"  y="191" width="44" height="18" rx="4"/>
    <text class="blk-label" x="68"  y="200">BLK 1</text>

    <rect id="B2"  class="blk clear" x="146" y="191" width="44" height="18" rx="4"/>
    <text class="blk-label" x="168" y="200">BLK 2</text>

    <rect id="B3"  class="blk clear" x="268" y="191" width="44" height="18" rx="4"/>
    <text class="blk-label" x="290" y="200">BLK 3</text>

    <rect id="B4"  class="blk clear" x="378" y="191" width="44" height="18" rx="4"/>
    <text class="blk-label" x="400" y="200">BLK 4</text>

    <!-- Line B blocks -->
    <rect id="B5"  class="blk clear" x="46"  y="124" width="44" height="18" rx="4"/>
    <text class="blk-label" x="68"  y="133">BLK 5</text>

    <rect id="B6"  class="blk clear" x="146" y="124" width="44" height="18" rx="4"/>
    <text class="blk-label" x="168" y="133">BLK 6</text>

    <rect id="B7"  class="blk clear" x="248" y="124" width="44" height="18" rx="4"/>
    <text class="blk-label" x="270" y="133">BLK 7</text>

    <!-- Line C blocks -->
    <rect id="B8"  class="blk clear" x="46"  y="57"  width="44" height="18" rx="4"/>
    <text class="blk-label" x="68"  y="66">BLK 8</text>

    <rect id="B9"  class="blk clear" x="146" y="57"  width="44" height="18" rx="4"/>
    <text class="blk-label" x="168" y="66">BLK 9</text>

    <rect id="B10" class="blk clear" x="248" y="57"  width="44" height="18" rx="4"/>
    <text class="blk-label" x="270" y="66">BLK10</text>

    <!-- B11 is AFTER the merge on the shared rail -->
    <rect id="B11" class="blk clear" x="398" y="57"  width="44" height="18" rx="4"/>
    <text class="blk-label" x="420" y="66">BLK11</text>

    <!-- Merge zone indicator -->
    <rect x="310" y="50" width="50" height="90" rx="6"
          fill="none" stroke="#d29922" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
    <text x="335" y="147" fill="#d29922" font-family="Courier New" font-size="7"
          text-anchor="middle" opacity="0.7">MERGE</text>

  </svg>

  <!-- STATUS BAR inside the track-wrap so it overlays at bottom -->
  <div id="statusbar">
    <span>OCC: <span class="occ-count" id="occ-count">0</span></span>
    <span>CLR: <span class="clr-count" id="clr-count">11</span></span>
    <span class="ts" id="last-update">--:--:--</span>
  </div>

</div><!-- end track-wrap -->

<!-- ═══════════════════════════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════════════════════════ -->
<script>
// ── Block → Nano mapping (for pill highlighting) ──────────────────
const NANO_BLOCKS = {
  "1": ["B1","B2","B3","B4"],
  "2": ["B5","B6","B7","B8","B9","B10","B11"],
};

// ── State ─────────────────────────────────────────────────────────
const state = {};
for (let i = 1; i <= 11; i++) state[`B${i}`] = false;

// ── SocketIO ──────────────────────────────────────────────────────
const socket = io();

socket.on("connect", () => {
  console.log("Connected to RPi server");
  setPill("1", true);
  setPill("2", true);
  socket.emit("request_state");
});

socket.on("disconnect", () => {
  setPill("1", false);
  setPill("2", false);
});

// Full state snapshot  { B1: false, B2: true, ... }
socket.on("state", (data) => {
  Object.entries(data).forEach(([block, occupied]) => {
    updateBlock(block, occupied);
  });
  refreshStatusBar();
});

// ── Update one block ──────────────────────────────────────────────
function updateBlock(blockId, occupied) {
  const rect = document.getElementById(blockId);
  if (!rect) return;
  state[blockId] = occupied;

  rect.classList.remove("clear", "occupied");
  rect.classList.add(occupied ? "occupied" : "clear");
}

// ── Status bar ────────────────────────────────────────────────────
function refreshStatusBar() {
  const occ = Object.values(state).filter(Boolean).length;
  const clr = 11 - occ;
  document.getElementById("occ-count").textContent = occ;
  document.getElementById("clr-count").textContent = clr;

  const now = new Date();
  document.getElementById("last-update").textContent =
    now.toTimeString().slice(0,8);
}

// ── Nano pill ─────────────────────────────────────────────────────
function setPill(id, online) {
  const el = document.getElementById(`pill${id}`);
  if (!el) return;
  el.classList.toggle("online", online);
}

// Refresh clock every second even without events
setInterval(() => {
  const now = new Date();
  document.getElementById("last-update").textContent =
    now.toTimeString().slice(0,8);
}, 1000);
</script>

</body>
</html>
