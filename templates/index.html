<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Railway Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
:root{
  --bg:#0d1117;--surf:#161b22;--border:#21262d;
  --txt:#e6edf3;--muted:#484f58;
  --green:#2ea043;--ggreen:#3fb950;
  --red:#da3633;--gred:#f85149;
  --yellow:#d29922;--track:#30363d;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:480px;height:320px;overflow:hidden;
  background:var(--bg);color:var(--txt);
  font-family:'Courier New',monospace;
}

/* ── HEADER ─────────────────────────────────────────────── */
#hdr{
  height:30px;background:var(--surf);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content:space-between;padding:0 10px;
}
#hdr h1{font-size:10px;letter-spacing:.12em;text-transform:uppercase;}
.pills{display:flex;gap:5px;}
.pill{
  font-size:9px;font-weight:700;padding:2px 8px;
  border-radius:10px;border:1px solid var(--border);
  color:var(--muted);background:var(--bg);transition:all .4s;
}
.pill.on{color:var(--ggreen);border-color:var(--green);background:#2ea04318;}

/* ── SVG AREA ────────────────────────────────────────────── */
#wrap{position:relative;width:480px;height:290px;}
svg{width:480px;height:268px;display:block;}

/* ── BLOCKS ──────────────────────────────────────────────── */
.blk{transition:fill .25s,filter .25s;}
.blk.clr{fill:var(--green);filter:drop-shadow(0 0 4px var(--ggreen));}
.blk.occ{fill:var(--red);filter:drop-shadow(0 0 8px var(--gred));
  animation:pulse .65s ease-in-out infinite alternate;}
@keyframes pulse{
  from{filter:drop-shadow(0 0 4px var(--gred));}
  to  {filter:drop-shadow(0 0 16px var(--gred));}
}
.lbl{
  fill:#fff;font-family:'Courier New',monospace;font-size:8.5px;
  font-weight:700;text-anchor:middle;dominant-baseline:middle;
  pointer-events:none;
}

/* ── STATUS BAR ──────────────────────────────────────────── */
#sbar{
  height:22px;background:var(--surf);
  border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:14px;
  font-size:9px;color:var(--muted);letter-spacing:.05em;
}
.occ-n{color:var(--gred);font-weight:700;}
.clr-n{color:var(--ggreen);font-weight:700;}
#ts{margin-left:auto;}
</style>
</head>
<body>

<div id="hdr">
  <h1>&#11035; Railway Block Monitor</h1>
  <div class="pills">
    <div class="pill" id="p1">NANO-1</div>
    <div class="pill" id="p2">NANO-2</div>
  </div>
</div>

<div id="wrap">
<!--
  TRACK LAYOUT (matches your image)
  ViewBox 480 × 268

  Line A (bottom) : y=210  — B1(70) B2(170) B3(300) B4(410)
  Line B (middle) : y=140  — B5(70) B6(170) B7(280)
                    B7 curves up → merges into top rail at x≈330,y=70
  Line C (top)    : y=70   — B8(70) B9(170) B10(280) | B11(415) after merge
-->
<svg viewBox="0 0 480 268" xmlns="http://www.w3.org/2000/svg">

  <!-- dot grid -->
  <defs>
    <pattern id="g" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#21262d"/>
    </pattern>
  </defs>
  <rect width="480" height="268" fill="url(#g)"/>

  <!-- ── SHADOW RAILS ─────────────────────────────────────── -->
  <path d="M15 210 L465 210" stroke="#070b10" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M15 140 L330 140 Q385 140 385 105 L385 70 L465 70"
        stroke="#070b10" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M15 70 L330 70"
        stroke="#070b10" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- ── VISIBLE RAILS ────────────────────────────────────── -->
  <!-- Line A -->
  <path d="M15 210 L465 210" stroke="#30363d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Line B → merges up into C -->
  <path d="M15 140 L330 140 Q385 140 385 105 L385 70 L465 70"
        stroke="#30363d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Line C (left segment before merge) -->
  <path d="M15 70 L330 70"
        stroke="#30363d" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Rail end ticks -->
  <line x1="15" y1="200" x2="15" y2="220" stroke="#30363d" stroke-width="3"/>
  <line x1="15" y1="130" x2="15" y2="150" stroke="#30363d" stroke-width="3"/>
  <line x1="15" y1="60"  x2="15" y2="80"  stroke="#30363d" stroke-width="3"/>
  <line x1="465" y1="200" x2="465" y2="220" stroke="#30363d" stroke-width="3"/>
  <line x1="465" y1="60"  x2="465" y2="80"  stroke="#30363d" stroke-width="3"/>

  <!-- Line ID labels -->
  <text x="7" y="213" fill="#484f58" font-family="Courier New" font-size="8" font-weight="700">A</text>
  <text x="7" y="143" fill="#484f58" font-family="Courier New" font-size="8" font-weight="700">B</text>
  <text x="7" y="73"  fill="#484f58" font-family="Courier New" font-size="8" font-weight="700">C</text>

  <!-- ── MERGE ZONE ─────────────────────────────────────────── -->
  <rect x="330" y="58" width="60" height="94" rx="5"
        fill="none" stroke="#d29922" stroke-width="1"
        stroke-dasharray="4 3" opacity="0.55"/>
  <text x="360" y="158" fill="#d29922" font-family="Courier New"
        font-size="7" text-anchor="middle" opacity="0.7">MERGE</text>

  <!-- ══════════════════════════════════════════════════════
       BLOCK RECTANGLES   width=46 height=19
       Centred on track y. x given is left edge.
  ══════════════════════════════════════════════════════ -->

  <!-- Line A  (y=210) -->
  <rect id="B1"  class="blk clr" x="47"  y="200" width="46" height="19" rx="4"/>
  <text class="lbl" x="70"  y="210">BLK 1</text>

  <rect id="B2"  class="blk clr" x="147" y="200" width="46" height="19" rx="4"/>
  <text class="lbl" x="170" y="210">BLK 2</text>

  <rect id="B3"  class="blk clr" x="277" y="200" width="46" height="19" rx="4"/>
  <text class="lbl" x="300" y="210">BLK 3</text>

  <rect id="B4"  class="blk clr" x="387" y="200" width="46" height="19" rx="4"/>
  <text class="lbl" x="410" y="210">BLK 4</text>

  <!-- Line B  (y=140) -->
  <rect id="B5"  class="blk clr" x="47"  y="130" width="46" height="19" rx="4"/>
  <text class="lbl" x="70"  y="140">BLK 5</text>

  <rect id="B6"  class="blk clr" x="147" y="130" width="46" height="19" rx="4"/>
  <text class="lbl" x="170" y="140">BLK 6</text>

  <rect id="B7"  class="blk clr" x="257" y="130" width="46" height="19" rx="4"/>
  <text class="lbl" x="280" y="140">BLK 7</text>

  <!-- Line C  (y=70) -->
  <rect id="B8"  class="blk clr" x="47"  y="60"  width="46" height="19" rx="4"/>
  <text class="lbl" x="70"  y="70">BLK 8</text>

  <rect id="B9"  class="blk clr" x="147" y="60"  width="46" height="19" rx="4"/>
  <text class="lbl" x="170" y="70">BLK 9</text>

  <rect id="B10" class="blk clr" x="257" y="60"  width="46" height="19" rx="4"/>
  <text class="lbl" x="280" y="70">BLK10</text>

  <!-- B11 after merge on shared rail -->
  <rect id="B11" class="blk clr" x="392" y="60"  width="46" height="19" rx="4"/>
  <text class="lbl" x="415" y="70">BLK11</text>

</svg>

<div id="sbar">
  <span>OCC:&nbsp;<span class="occ-n" id="on">0</span></span>
  <span>CLR:&nbsp;<span class="clr-n" id="cn">11</span></span>
  <span id="ts">--:--:--</span>
</div>
</div>

<script>
const socket = io();
const state  = {};
for(let i=1;i<=11;i++) state[`B${i}`]=false;

socket.on("connect",    ()=>{ socket.emit("request_state"); pill(true); });
socket.on("disconnect", ()=>{ pill(false); });

socket.on("state", data=>{
  Object.entries(data).forEach(([b,occ])=> setBlock(b,occ));
  updateBar();
});

function setBlock(id, occupied){
  state[id]=occupied;
  const el=document.getElementById(id);
  if(!el) return;
  el.classList.remove("clr","occ");
  el.classList.add(occupied?"occ":"clr");
}

function updateBar(){
  const o=Object.values(state).filter(Boolean).length;
  document.getElementById("on").textContent=o;
  document.getElementById("cn").textContent=11-o;
  document.getElementById("ts").textContent=new Date().toTimeString().slice(0,8);
}

function pill(on){
  ["p1","p2"].forEach(id=>{
    document.getElementById(id).classList.toggle("on",on);
  });
}

setInterval(()=>{
  document.getElementById("ts").textContent=new Date().toTimeString().slice(0,8);
},1000);
</script>
</body>
</html>
